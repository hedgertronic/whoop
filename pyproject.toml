[project]
name = "whoop"
version = "1.0.0"
description = "Tools for acquiring and analyzing WHOOP API data."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Josh Hejka", email = "josh@joshhejka.com" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "authlib>=1.3",
    "requests>=2.28",
]

[project.urls]
homepage = "https://github.com/hedgertronic/whoop"
repository = "https://github.com/hedgertronic/whoop"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-recording>=0.13",
    "types-requests>=2.28",
    "pre-commit>=3.8",
    "coverage[toml]>=7.6",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["whoop"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "B",
    "C4",
    "UP",
    "D",
    "S",
    "A",
    "ERA",
    "TRY",
    "C90",
]
# TRY003: ruff nudges toward custom exception classes to hold messages; we
# prefer raising stdlib exceptions with inline messages (never enforced before).
ignore = ["D212", "TRY003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.coverage.run]
source = ["whoop"]
omit = ["test*"]

[tool.mypy]
strict = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
warn_unreachable = true

[[tool.mypy.overrides]]
# authlib ships no type stubs; scope the suppression to it rather than globally.
module = "authlib.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Test functions are intentionally unannotated and lean on mock objects whose
# attribute access is typed `Any`. Relax the strict-only purity flags so the
# suite is still checked, but isn't forced to annotate every fixture and mock.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
warn_return_any = false
check_untyped_defs = false
